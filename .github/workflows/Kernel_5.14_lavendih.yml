name: Build KernelSU Kernel

on:
  workflow_dispatch:
    inputs:
      KERNEL_CONFIG:
        description: 'Nama file defconfig'
        required: true
        default: 'lavender_user_defconfig'
      KERNEL_VERSION:
        description: 'Versi basis kernel (4.4 / 4.14 / 4.19)'
        required: true
        default: '4.4'
      PATCH_KERNELSU:
        description: 'Varian KernelSU (xxksu / ksu-next / none)'
        required: true
        default: 'xxksu'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison ccache zip uriparser-dev git curl wget

      - name: 🧰 Fetch Toolchains & Setup Source
        run: |
          # Clone Toolchain Clang (Proton Clang / Android Clang)
          git clone --depth=1 https://gitlab.com/LeSight/clang-r383902.git clang
          
          # Clone Toolchain GCC Cross-Compiler
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

          # Clone AnyKernel3 untuk packaging .zip
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # Setup KernelSU jika diaktifkan
          if [ "${{ github.event.inputs.PATCH_KERNELSU }}" == "xxksu" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          elif [ "${{ github.event.inputs.PATCH_KERNELSU }}" == "ksu-next" ]; then
            curl -LSs "https://raw.githubusercontent.com/rifs28/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          fi

      - name: 🔨 Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          # Set PATH ke Toolchain yang didownload
          export PATH="$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"

          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          KERNEL_VER="${{ github.event.inputs.KERNEL_VERSION }}"
          
          if [ "$KERNEL_VER" != "4.19" ]; then
            LD_BIN="aarch64-linux-android-ld"
          else
            LD_BIN="ld.lld"
          fi

          # 1. Spoofing versi kernel ke 5.14.505 via Makefile
          sed -i 's/^VERSION = .*/VERSION = 5/' Makefile
          sed -i 's/^PATCHLEVEL = .*/PATCHLEVEL = 14/' Makefile
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 505/' Makefile

          # 2. String suffix (< 64 karakter)
          SPOOF_VERSION="-BTX-lavender-xxKSU"

          COMMON_ARGS="-j$(nproc --all) O=out ARCH=arm64 CC=clang LD=$LD_BIN AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCFLAGS=-fcommon HOSTCXXFLAGS=-fcommon"

          if [ "$KERNEL_VER" != "4.19" ]; then
            COMMON_ARGS="$COMMON_ARGS CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          else
            COMMON_ARGS="$COMMON_ARGS CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          fi

          # Generate defconfig awal
          make $COMMON_ARGS "${{ github.event.inputs.KERNEL_CONFIG }}"

          if [ -f scripts/config ] && [ -f out/.config ]; then
            ./scripts/config --file out/.config -d COMPAT_VDSO
            
            # Set Localversion & matikan auto-version
            ./scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "$SPOOF_VERSION"
            ./scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO
            
            # Konfigurasi KernelSU & Syscall Hooking
            if [ "${{ github.event.inputs.PATCH_KERNELSU }}" != "none" ]; then
              ./scripts/config --file out/.config -e CONFIG_KSU
              ./scripts/config --file out/.config -e CONFIG_KSU_TAMPER_SYS_CALL
              ./scripts/config --file out/.config -d CONFIG_KSU_VIA_KPROBES
              ./scripts/config --file out/.config -e CONFIG_IP_NF_SECURITY
              ./scripts/config --file out/.config -e CONFIG_IP6_NF_SECURITY
            fi

            # Terapkan perubahan config
            make $COMMON_ARGS olddefconfig
          fi

          # Eksekusi Kompilasi
          make $COMMON_ARGS 2>&1 | tee build.log

          # Cari hasil output Image
          IMG=$(find out/arch/arm64/boot -type f -name "Image.gz-dtb" | head -n1)
          if [ -z "$IMG" ]; then
            IMG=$(find out/arch/arm64/boot -type f \( -name "Image.gz" -o -name "Image" -o -name "Image-dtb" \) | head -n1)
          fi

          if [ -z "$IMG" ]; then
            echo "Kernel image not found, build failed."
            exit 1
          fi

          # Pindahkan Image ke AnyKernel3 untuk di-zip
          cp $IMG AnyKernel3/
          cd AnyKernel3
          zip -r9 "../Kernel-5.14.505-lavender.zip" * -x .git README.md

      - name: 📤 Upload Flashable Kernel (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-5.14.505-lavender-zip
          path: Kernel-5.14.505-lavender.zip
