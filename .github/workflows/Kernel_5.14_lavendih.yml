name: 🛠️ Build Kernel - FIXED

on:
  workflow_dispatch:
    inputs:
      BRANCH_NAME:
        description: '🌿 Input Branch Name (e.g., lineage-20)'
        required: true
        type: string
        default: 'upstream-302'
      DEFCONFIG_NAME:
        description: '💾 Custom Defconfig Name'
        required: true
        type: string
        default: 'lavender-perf_defconfig'
      LOCALVERSION:
        description: '🏷️ Custom Kernel Name'
        required: true
        type: string
        default: 'BTX-4.4-MamboSU'
      LOCALVERSION_AUTO:
        description: '🔧 Enable Localversion Auto'
        required: true
        default: false
        type: boolean
      BUILD_NEWCAM:
        description: '📷 Use Newcam Build'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Inject KernelSU (backslashxx)'
        required: true
        default: true
        type: boolean

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/imarsya991-gif/BTX_Kernel_sdm660.git
  KERNEL_BRANCH: "${{ inputs.BRANCH_NAME }}"
  DEFCONFIG: "${{ inputs.DEFCONFIG_NAME }}"
  DEFAULT_HOSTNAME: xiaomi@redmi
  BUILD_USER: xiaomi
  BUILD_HOST: redmi
  BOT_API: 8659587120:AAEEQZ1aD5SkUXoUQJYBXhOA7dinaUcLuJA
  TELEGRAM_GROUP_ID: -1004324974450

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Clone Kernel Source
        run: |
          rm -rf "${{ env.KERNEL_DIR }}"
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends bc bison flex libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Setup KernelSU
        if: ${{ inputs.INJECT_KSU == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          # === FIX #1: kernel/exit.c corrupt ===
          if [ -f kernel/exit.c ]; then
            if ! head -n1 kernel/exit.c | grep -q "/\*"; then
              sed -i '1i /*' kernel/exit.c
              echo "Fixed kernel/exit.c"
            fi
            head -n3 kernel/exit.c
          fi

      - name: Restore AOSP Clang Cache
        id: clang-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-r383902-fixed

      - name: Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          curl -L --retry 5 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz" -o aosp_clang.archive
          tar -xf aosp_clang.archive
          rm -f aosp_clang.archive

      - name: Prepare Configs - FIX ALL ERRORS
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          # === FIX #2: dm-req-crypt.c SECTOR_SIZE redefined ===
          if [ -f drivers/md/dm-req-crypt.c ]; then
            sed -i '/#define SECTOR_SIZE/d' drivers/md/dm-req-crypt.c
            echo "Fixed dm-req-crypt.c"
          fi

          # === FIX #3: hci_core.c unused variable id ===
          if [ -f net/bluetooth/hci_core.c ]; then
            sed -i 's/^\s*int id;/\tint id __maybe_unused;/' net/bluetooth/hci_core.c
            echo "Fixed hci_core.c"
          fi

          # === FIX #4: ufshcd.c lrbp + shift ===
          if [ -f drivers/scsi/ufs/ufshcd.c ]; then
            sed -i 's/1ULL << 32/1ULL << 31/g' drivers/scsi/ufs/ufshcd.c || true
            sed -i 's/1 << 32/1 << 31/g' drivers/scsi/ufs/ufshcd.c || true
          fi

          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- ${{ env.DEFCONFIG }}

          ./scripts/config --file "$OUT_DIR/.config" --set-str CONFIG_DEFAULT_HOSTNAME "${{ env.DEFAULT_HOSTNAME }}"
          ./scripts/config --file "$OUT_DIR/.config" --set-str CONFIG_LOCALVERSION "-${{ inputs.LOCALVERSION }}"
          
          if [ "${{ inputs.LOCALVERSION_AUTO }}" == "true" ]; then
            ./scripts/config --file "$OUT_DIR/.config" --enable CONFIG_LOCALVERSION_AUTO
          else
            ./scripts/config --file "$OUT_DIR/.config" --disable CONFIG_LOCALVERSION_AUTO
          fi

          [ "${{ inputs.BUILD_NEWCAM }}" == "true" ] && ./scripts/config --file "$OUT_DIR/.config" --enable CONFIG_XIAOMI_NEW_CAMERA_BLOBS
          [ "${{ inputs.INJECT_KSU }}" == "true" ] && ./scripts/config --file "$OUT_DIR/.config" --enable CONFIG_KSU && ./scripts/config --file "$OUT_DIR/.config" --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

          # Matikan LTO biar gak error di 4.4
          ./scripts/config --file "$OUT_DIR/.config" --disable CONFIG_LTO_CLANG || true
          ./scripts/config --file "$OUT_DIR/.config" --disable CONFIG_THINLTO || true

          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang olddefconfig

      - name: Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ env.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.BUILD_HOST }}"
          
          # KCFLAGS PENTING: biar warning gak jadi error
          make -j2 O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -fcommon -Wno-macro-redefined -Wno-unused-variable -Wno-shift-count-overflow -Ulinux" \
            Image.gz-dtb 2>&1 | tee build.log

          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Build gagal cek log"; tail -n 100 build.log; exit 1
          fi

      - name: Package Kernel Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../${{ inputs.LOCALVERSION }}.zip ./*
          cd ..

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: ${{ inputs.LOCALVERSION }}.zip
