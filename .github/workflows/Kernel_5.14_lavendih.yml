name: Build BTX Kernel AOSP Clang + Telegram

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Source Repo URL'
        required: true
        default: 'https://github.com/imarsya991-gif/BTX_Kernel_sdm660'
      KERNEL_BRANCH:
        description: 'Branch source'
        required: true
        default: 'upstream-302'
      KERNEL_CONFIG:
        description: 'Defconfig file'
        required: true
        default: 'lavender-perf_defconfig'
      PATCH_KERNELSU:
        description: 'KSU variant'
        required: true
        type: choice
        options: [xxksu, ksu-next, none]
        default: 'xxksu'
      CLANG_SOURCE:
        description: 'AOSP Clang (aosp r416183b1/proton)'
        required: true
        default: 'aosp-r416183b1'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📢 Notify START
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "no token"; exit 0; fi
          curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage -d chat_id=$CHAT_ID -d text="🚀 Build Started AOSP - ${{ inputs.KERNEL_BRANCH }} - ${{ inputs.KERNEL_CONFIG }}"

      - name: Clone Kernel
        run: |
          rm -rf kernel AnyKernel3 out clang
          git clone --depth=1 --branch ${{ inputs.KERNEL_BRANCH }} ${{ inputs.KERNEL_SOURCE }}.git kernel || git clone --depth=1 --branch ${{ inputs.KERNEL_BRANCH }} ${{ inputs.KERNEL_SOURCE }} kernel

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Setup AOSP Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison zip curl wget cpio python3 perl zstd dwarves gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev
          
          rm -rf clang
          echo "Downloading AOSP Clang r416183b1 from Lineage mirror..."
          # Mirror yang work di Actions
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b1.git clang -b lineage-19.1 || \
          git clone --depth=1 https://gitlab.com/ThankYouMario/proton-clang.git clang || \
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          clang --version
          ld.lld --version || ld.lld-14 --version
          ls clang/bin
          
      - name: Setup KSU
        run: |
          cd kernel
          if [ "${{ inputs.PATCH_KERNELSU }}" == "xxksu" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          elif [ "${{ inputs.PATCH_KERNELSU }}" == "ksu-next" ]; then
            curl -LSs "https://raw.githubusercontent.com/rifs28/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          OUT=$GITHUB_WORKSPACE/out
          MAKE_ARGS="-C kernel O=$OUT ARCH=arm64 SUBARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=0 HOSTCFLAGS=-fcommon HOSTCXXFLAGS=-fcommon -j$(nproc --all)"
          KCF="-Wno-error"
          mkdir -p $OUT
          make $MAKE_ARGS KCFLAGS="$KCF" ${{ inputs.KERNEL_CONFIG }}
          CFG="kernel/scripts/config --file $OUT/.config"
          $CFG --set-str CONFIG_LOCALVERSION "-BTX-AOSP-${{ inputs.KERNEL_BRANCH }}" || true
          $CFG -d CONFIG_LOCALVERSION_AUTO || true
          $CFG -d CONFIG_THINLTO || true
          $CFG -d CONFIG_LTO_CLANG || true
          $CFG -d CONFIG_CFI_CLANG || true
          if [ "${{ inputs.PATCH_KERNELSU }}" != "none" ]; then $CFG -e CONFIG_KSU; fi
          make $MAKE_ARGS KCFLAGS="$KCF" olddefconfig
          make $MAKE_ARGS KCFLAGS="$KCF" Image.gz-dtb 2>&1 | tee build.log
          ls -lh $OUT/arch/arm64/boot/
          cp $OUT/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          ZIPNAME="BTX-AOSP-${{ inputs.KERNEL_BRANCH }}-$(date +%Y%m%d-%H%M)"
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          zip -r9 "../$ZIPNAME.zip" * -x .git README.md

      - name: Upload Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}.zip

      - name: 📢 SUCCESS to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage -d chat_id=$CHAT_ID -d text="✅ SUKSES ${{ env.ZIPNAME }}"
          curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendDocument -F chat_id=$CHAT_ID -F document=@"${{ env.ZIPNAME }}.zip"

      - name: ❌ ERROR to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage -d chat_id=$CHAT_ID -d text="❌ GAGAL ${{ inputs.KERNEL_BRANCH }}"
          tail -n 200 build.log > error.txt || true
          curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendDocument -F chat_id=$CHAT_ID -F document=@error.txt
          curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendDocument -F chat_id=$CHAT_ID -F document=@build.log || true
