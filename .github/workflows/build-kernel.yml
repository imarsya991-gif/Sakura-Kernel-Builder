name: Manual Build Kernel - BTX FIXED Full LTO MamboSU

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "URL repo kernel source (4.19 lavender)"
        required: true
        type: string
      KERNEL_BRANCH:
        description: "Branch kernel source"
        required: true
        type: string
      KERNEL_CONFIG:
        description: "Nama defconfig"
        required: true
        type: string
      CONFIG_FRAGMENTS:
        description: "Fragment config yang di-merge (pisah spasi)"
        required: false
        type: string
        default: ""
      KERNEL_VERSION:
        description: "Opsi versi kernel"
        required: false
        type: string
        default: ""
      XXKSU:
        description: "Aktifkan KernelSU"
        required: true
        type: boolean
        default: true
      KSU_VARIANT:
        description: "Varian KSU"
        required: true
        type: choice
        options:
          - sukisu
          - xxksu
          - finasu
        default: xxksu
      SUKISU_SOURCE:
        required: true
        type: choice
        options:
          - non-gki-port
          - official-builtin
        default: non-gki-port
      KSU_HOOK_MODE:
        required: true
        type: choice
        options:
          - syscall
          - manual
        default: syscall
      LTO_MODE:
        description: "Mode LTO full/thin/none"
        required: true
        type: choice
        options:
          - none
          - thin
          - full
        default: full
      CLANG_REV:
        description: "Revisi AOSP clang"
        required: true
        type: string
        default: "clang-r596125"
      CODENAME:
        required: true
        type: string
        default: "lavender"
      EXTRAVERSION:
        required: false
        type: string
        default: "MamboSU-FULL-LTO"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KERNEL_SOURCE: ${{ github.event.inputs.KERNEL_SOURCE }}
      KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_BRANCH }}
      KERNEL_CONFIG: ${{ github.event.inputs.KERNEL_CONFIG }}
      CONFIG_FRAGMENTS: ${{ github.event.inputs.CONFIG_FRAGMENTS }}
      KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
      XXKSU: ${{ github.event.inputs.XXKSU }}
      KSU_VARIANT: ${{ github.event.inputs.KSU_VARIANT }}
      SUKISU_SOURCE: ${{ github.event.inputs.SUKISU_SOURCE }}
      KSU_HOOK_MODE: ${{ github.event.inputs.KSU_HOOK_MODE }}
      LTO_MODE: ${{ github.event.inputs.LTO_MODE }}
      CLANG_REV: ${{ github.event.inputs.CLANG_REV }}
      CODENAME: ${{ github.event.inputs.CODENAME }}
      EXTRAVERSION: ${{ github.event.inputs.EXTRAVERSION }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      KBUILD_BUILD_USER: "github-actions"
      KBUILD_BUILD_HOST: "ci"

    steps:
      - name: "📤 Telegram: Notif Build Dimulai"
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then exit 0; fi
          TEXT=$(printf '%s\n' "🚀 Build dimulai" "Kernel : ${EXTRAVERSION:-$CODENAME} (${CODENAME})" "Source : ${KERNEL_SOURCE}" "Branch : ${KERNEL_BRANCH}" "Config : ${KERNEL_CONFIG}" "KSU : ${XXKSU} (${KSU_VARIANT}) - MamboSU" "LTO : ${LTO_MODE} - FULL MODE" "Clang : ${CLANG_REV}" "Run : ${RUN_URL}")
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode chat_id="${CHAT_ID}" --data-urlencode text="${TEXT}" -d disable_web_page_preview=true

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /usr/local/julia* /usr/share/miniconda /usr/local/share/chromium || true
          sudo apt-get clean
          sudo docker image prune --all --force || true

      - name: 💾 Swap 32GB (Anti OOM Full LTO)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
          free -h

      - name: 📦 Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev git curl wget zip unzip python3 python-is-python3 cpio kmod rsync ccache dwarves libncurses-dev device-tree-compiler

      - name: 📥 Clone kernel source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          cd kernel
          if git submodule status | grep -qE '^-'; then git submodule update --init --recursive; fi
          cd ..
          echo "KDIR=$(pwd)/kernel" >> $GITHUB_ENV

      - name: 🛠️ Setup AOSP Clang & GCC (Clang 22)
        run: |
          mkdir -p toolchain/clang
          curl -fL --retry 3 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_REV}.tar.gz" | tar -xz -C toolchain/clang
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32
          echo "$(pwd)/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc64/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc32/bin" >> $GITHUB_PATH
          toolchain/clang/bin/clang --version

      - name: 📥 Integrasi xxksu (RapliVx - MamboSU) - FIXED
        if: ${{ github.event.inputs.XXKSU == 'true' && github.event.inputs.KSU_VARIANT == 'xxksu' }}
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/xxksu/kernel/setup.sh" | bash -s xxksu MamboSU
          ls -la drivers/ | grep -i kernelsu || true

      - name: 🛡️ Aktifkan KSU Simple (echo/sed - No nano)
        if: ${{ github.event.inputs.XXKSU == 'true' }}
        working-directory: kernel
        run: |
          CFG="arch/arm64/configs/$KERNEL_CONFIG"
          echo "=== SET KSU SIMPLE MODE ==="
          sed -i '/CONFIG_KSU/d' "$CFG"
          sed -i '/CONFIG_KPROBES/d' "$CFG"
          sed -i '/CONFIG_KPM/d' "$CFG"
          echo "CONFIG_KSU=y" >> "$CFG"
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> "$CFG"
          echo "# CONFIG_KPROBES is not set" >> "$CFG"
          echo "CONFIG_KSU_SUSFS=n" >> "$CFG"
          echo "# CONFIG_KSU_WITH_KPROBES is not set" >> "$CFG"
          grep -n "CONFIG_KSU" "$CFG" | tail -n 10

      - name: 🔨 Build Kernel Full LTO Anti-Limit
        working-directory: kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          make $ARGS "$KERNEL_CONFIG" $CONFIG_FRAGMENTS 2>&1 | tee build.log
          LV=$(printf '%s' "${EXTRAVERSION:-$CODENAME}" | tr -cd 'A-Za-z0-9._-')
          [ -z "$LV" ] && LV="$CODENAME"
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-${LV}"
          scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO
          echo "Mode LTO: $LTO_MODE"
          case "$LTO_MODE" in
            full)
              scripts/config --file out/.config --enable CONFIG_LTO_CLANG
              scripts/config --file out/.config --enable CONFIG_LTO_CLANG_FULL
              scripts/config --file out/.config --disable CONFIG_THINLTO
              ;;
            thin)
              scripts/config --file out/.config --enable CONFIG_LTO_CLANG
              scripts/config --file out/.config --enable CONFIG_THINLTO
              ;;
            none)
              scripts/config --file out/.config --disable CONFIG_LTO_CLANG
              ;;
          esac
          sed -i '/CONFIG_KSU/d' out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> out/.config
          echo "# CONFIG_KPROBES is not set" >> out/.config
          echo "CONFIG_KSU_SUSFS=n" >> out/.config
          make $ARGS olddefconfig 2>&1 | tee -a build.log
          if [ "$LTO_MODE" = "full" ]; then JOBS=2; else JOBS=$(nproc --all); fi
          echo "Building with -j${JOBS}"
          set +e
          make -k -j${JOBS} $ARGS Image.gz-dtb 2>&1 | tee -a build.log
          set -e
          BOOT=out/arch/arm64/boot
          if [ ! -f "$BOOT/Image.gz-dtb" ]; then
            set +e
            make -k -j${JOBS} $ARGS Image.gz dtbs 2>&1 | tee -a build.log
            set -e
            if [ -f "$BOOT/Image.gz" ]; then
              DTBS=$(find "$BOOT/dts" -name '*.dtb' | sort)
              cat "$BOOT/Image.gz" $DTBS > "$BOOT/Image.gz-dtb"
            fi
          fi
          IMG=$(find out/arch/arm64/boot -type f -name "Image.gz-dtb" | head -n1)
          [ -z "$IMG" ] && IMG=$(find out/arch/arm64/boot -type f \( -name "Image.gz" -o -name "Image" \) | head -n1)
          if [ -z "$IMG" ]; then echo "Build gagal!" | tee -a build.log; exit 1; fi
          echo "IMG_PATH=$(pwd)/$IMG" >> $GITHUB_ENV

      - name: 🏷️ Setup file names
        run: |
          DATE=$(date +%Y%m%d)
          BASE_NAME="${EXTRAVERSION:-$CODENAME}-${CODENAME}-${DATE}"
          echo "BASE_NAME=${BASE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=build-${{ github.run_id }}" >> $GITHUB_ENV

      - name: 🎁 Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/*.zip
          cp "$IMG_PATH" AnyKernel3/
          sed -i "s/device.name1=.*/device.name1=${CODENAME}/" AnyKernel3/anykernel.sh || true
          sed -i -E 's#^(BLOCK|block)=.*#\1=/dev/block/bootdevice/by-name/boot;#' AnyKernel3/anykernel.sh
          sed -i -E 's#^(IS_SLOT_DEVICE|is_slot_device)=.*#\1=0;#' AnyKernel3/anykernel.sh
          sed -i "s|^kernel.string=.*|kernel.string=${BASE_NAME}|" AnyKernel3/anykernel.sh
          sed -i -E 's#^dump_boot;#split_boot;#; s#^write_boot;#flash_boot;#' AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 "../${BASE_NAME}.zip" . -x ".git*"
          cd ..
          echo "ZIP_PATH=$(pwd)/${BASE_NAME}.zip" >> $GITHUB_ENV

      - name: 🚀 Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.BASE_NAME }}"
          files: ${{ env.ZIP_PATH }}

      - name: "📤 Telegram: Kirim Hasil Build (.zip)"
        continue-on-error: true
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" -F chat_id="${CHAT_ID}" -F document=@"${ZIP_PATH}" -F caption="✅ Build Berhasil: ${BASE_NAME} - Full LTO MamboSU"

      - name: "📤 Telegram: Kirim Log saat Gagal (FIXED ANTI-LIMIT)"
        if: failure()
        continue-on-error: true
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then exit 0; fi
          LOG="kernel/build.log"
          if [ ! -f "$LOG" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" -d chat_id="${CHAT_ID}" -d text="❌ Build Gagal ${CODENAME} sebelum compile"
            exit 0
          fi
          echo "=== ERROR SUMMARY ===" > errors.txt
          grep -nE "error:|fatal error|undefined reference|ld.lld: error|make.*Error" "$LOG" | tail -n 120 >> errors.txt || true
          echo -e "\n=== LAST 100 LINES ===" >> errors.txt
          tail -n 100 "$LOG" >> errors.txt
          tail -c 40000000 "$LOG" > build-log-trimmed.log
          gzip -9 -c build-log-trimmed.log > build-log.gz
          ls -lh errors.txt build-log.gz
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" -F chat_id="${CHAT_ID}" -F document=@"errors.txt" -F caption="❌ ${CODENAME} Full LTO Gagal - Error"
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" -F chat_id="${CHAT_ID}" -F document=@"build-log.gz" -F caption="Log lengkap trimmed 40MB"
