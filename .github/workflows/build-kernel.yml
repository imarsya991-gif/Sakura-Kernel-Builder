name: Manual Build Kernel - NM PROJECT (lavender 4.4)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "URL repo kernel source (4.4 lavender)"
        required: true
        type: string
      KERNEL_BRANCH:
        description: "Branch kernel source"
        required: true
        type: string
      KERNEL_CONFIG:
        description: "Nama defconfig (mis: lavender_defconfig)"
        required: true
        type: string
      CONFIG_FRAGMENTS:
        description: "Fragment config yang di-merge (pisah spasi), kosongkan kalau tidak ada"
        required: false
        type: string
        default: ""
      XXKSU:
        description: "Aktifkan xxksu lewat defconfig"
        required: true
        type: boolean
        default: true
      KSU_HOOK_MODE:
        description: "Mode hook xxksu: syscall = tamper syscall table (tanpa patch source); manual = patch hook di source"
        required: true
        type: choice
        options:
          - syscall
          - manual
        default: syscall
      ANTI_FLICKER:
        description: "Patch anti kedip LCD (ESD check off, LPM off, KCAL on, idle_pc off)"
        required: true
        type: boolean
        default: true
      LTO_MODE:
        description: "Mode LTO (full/thin hanya jalan kalau source punya CONFIG_LTO_CLANG; kalau tidak, diabaikan)"
        required: true
        type: choice
        options:
          - none
          - thin
          - full
        default: thin
      CODENAME:
        description: "Codename device"
        required: true
        type: string
        default: "lavender"
      EXTRAVERSION:
        description: "EXTRAVERSION / Nama Kernel"
        required: false
        type: string
        default: "NMメPROJECT"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      KERNEL_SOURCE: ${{ github.event.inputs.KERNEL_SOURCE }}
      KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_BRANCH }}
      KERNEL_CONFIG: ${{ github.event.inputs.KERNEL_CONFIG }}
      CONFIG_FRAGMENTS: ${{ github.event.inputs.CONFIG_FRAGMENTS }}
      XXKSU: ${{ github.event.inputs.XXKSU }}
      KSU_HOOK_MODE: ${{ github.event.inputs.KSU_HOOK_MODE }}
      ANTI_FLICKER: ${{ github.event.inputs.ANTI_FLICKER }}
      LTO_MODE: ${{ github.event.inputs.LTO_MODE }}
      CODENAME: ${{ github.event.inputs.CODENAME }}
      EXTRAVERSION: ${{ github.event.inputs.EXTRAVERSION }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      KBUILD_BUILD_USER: "github-actions"
      KBUILD_BUILD_HOST: "ci"

    steps:
      - name: "📤 Telegram: Notif Build Dimulai"
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::BOT_TOKEN/CHAT_ID kosong (secret belum dibuat atau namanya salah), lewati notif Telegram"
            exit 0
          fi
          TEXT=$(printf '%s\n' \
            "🚀 Build dimulai" \
            "Kernel : ${EXTRAVERSION:-$CODENAME} (${CODENAME})" \
            "Source : ${KERNEL_SOURCE}" \
            "Branch : ${KERNEL_BRANCH}" \
            "Config : ${KERNEL_CONFIG} ${CONFIG_FRAGMENTS}" \
            "LTO    : ${LTO_MODE}" \
            "AntiKedip : ${ANTI_FLICKER}" \
            "Run    : ${RUN_URL}")
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${CHAT_ID}" \
            --data-urlencode text="${TEXT}" \
            -d disable_web_page_preview=true
          echo

      - name: 🧹 Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /usr/lib/jvm /usr/local/julia* \
            /usr/share/miniconda /usr/local/share/chromium || true
          sudo apt-get clean
          sudo docker image prune --all --force || true
          echo "--- setelah dibersihkan"
          df -h / /mnt

      - name: 📊 Cek RAM dan disk
        run: |
          nproc
          free -h
          df -h "$GITHUB_WORKSPACE" / /mnt

      - name: 📦 Install build dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget zip unzip python3 python-is-python3 \
            cpio kmod rsync ccache dwarves libncurses-dev \
            device-tree-compiler

      - name: 💾 Swap (dibagi /mnt dan /)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          mkswp() {  # path, maks GB, sisa GB yang harus tetap bebas
            A=$(df --output=avail -BG "$(dirname "$1")" | tail -n1 | tr -dc 0-9)
            S=$(( A - $3 ))
            [ "$S" -gt "$2" ] && S=$2
            if [ "$S" -lt 2 ]; then
              echo "Lewati swap $1 (ruang bebas ${A}G tidak cukup)"
              return 0
            fi
            echo "Buat swap $1 ${S}G (bebas ${A}G)"
            sudo fallocate -l ${S}G "$1"
            sudo chmod 600 "$1"
            sudo mkswap "$1"
            sudo swapon "$1"
          }
          mkswp /mnt/swapfile 16 2
          mkswp /swapfile 16 18
          swapon --show
          free -h
          df -h / /mnt

      - name: 🗃️ Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 📥 Clone kernel source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          cd kernel
          if git submodule status | grep -qE '^-'; then
            git submodule update --init --recursive
          fi
          cd ..
          echo "KDIR=$(pwd)/kernel" >> $GITHUB_ENV

      - name: 🛠️ Setup Clang (Proton-Clang) & GCC
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32

          echo "$(pwd)/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc64/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc32/bin" >> $GITHUB_PATH

      - name: 📋 Cek defconfig & fragment
        working-directory: kernel
        run: |
          CFG_DIR="arch/arm64/configs"
          if [ ! -f "$CFG_DIR/$KERNEL_CONFIG" ]; then
            echo "::error::$CFG_DIR/$KERNEL_CONFIG tidak ada"
            ls "$CFG_DIR" | grep -i -E "lavender|sdm660|trinket" || ls "$CFG_DIR"
            exit 1
          fi
          for f in $CONFIG_FRAGMENTS; do
            if [ ! -f "$CFG_DIR/$f" ]; then
              echo "::error::$CFG_DIR/$f tidak ada"
              ls "$CFG_DIR"
              exit 1
            fi
            echo "=== isi $f"
            cat "$CFG_DIR/$f"
          done

      # Integrasi xxksu ke source via setup.sh (credit: @linx3141)
      - name: 📥 Integrasi xxksu (curl setup.sh)
        if: ${{ github.event.inputs.XXKSU == 'true' }}
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          echo "--- hasil integrasi"
          ls -la drivers/ | grep -i -E "kernelsu|xxksu" || true
          grep -n -i "kernelsu" drivers/Makefile drivers/Kconfig || true

      # Pasang hook syscall manual KSU otomatis (scope-minimized, dari backslashxx/KernelSU issue #5).
      # Tiap hook hanya dipasang kalau handler-nya ada di driver KSU dan pola kodenya cocok.
      - name: 🪝 Pasang hook manual KSU otomatis (hanya mode manual)
        if: ${{ github.event.inputs.XXKSU == 'true' && github.event.inputs.KSU_HOOK_MODE == 'manual' }}
        working-directory: kernel
        run: |
          cat > /tmp/ksu_hooks.py << 'PYEOF'
          import os, re, sys

          def read(p):
              with open(p, encoding='utf-8', errors='surrogateescape') as f:
                  return f.read()

          def write(p, t):
              with open(p, 'w', encoding='utf-8', errors='surrogateescape') as f:
                  f.write(t)

          ksu_src = ""
          for root, _, files in os.walk('drivers/kernelsu', followlinks=True):
              for fn in files:
                  if fn.endswith(('.c', '.h')):
                      ksu_src += read(os.path.join(root, fn)) + "\n"

          def have(sym):
              """True kalau simbol benar-benar DIDEFINISIKAN di driver KSU (bukan sekadar disebut/extern/dipanggil)."""
              if not ksu_src:
                  return True
              n = re.escape(sym)
              var = re.search(r'^(?!\s*extern\b)[ \t\w\*]*\b(?:bool|int)\b[ \t\w\*]*\b' + n + r'\b[ \t\w]*(?:=|;)', ksu_src, re.M)
              fn = re.search(r'^(?!\s*(?:static|extern|if|while|return)\b)[ \t\w\*]*\b' + n + r'\s*\([^;{]*\)\s*\{', ksu_src, re.M)
              return bool(var or fn)

          applied, skipped = [], []

          def line_start(t, pos):
              return t.rfind('\n', 0, pos) + 1

          def before_header(t, header_re, text):
              m = re.search(header_re, t, re.M)
              if not m:
                  return None
              ls = line_start(t, m.start())
              return t[:ls] + text + t[ls:]

          def after_header_brace(t, header_re, text):
              m = re.search(header_re, t, re.M | re.S)
              if not m:
                  return None
              return t[:m.end()] + "\n" + text + t[m.end():]

          def before_target(t, header_re, target_re, text):
              m = re.search(header_re, t, re.M | re.S)
              if not m:
                  return None
              n = re.search(target_re, t[m.end():], re.M)
              if not n:
                  return None
              pos = line_start(t, m.end() + n.start())
              return t[:pos] + text + t[pos:]

          def patch(path, label, need, marker, fn):
              if not os.path.exists(path):
                  skipped.append(f"{label}: {path} tidak ada"); return
              for s in need:
                  if not have(s):
                      skipped.append(f"{label}: driver KSU tidak mendefinisikan '{s}' (hook dilewati)"); return
              t = read(path)
              if marker in t:
                  skipped.append(f"{label}: sudah terpasang"); return
              r = fn(t)
              if r is None:
                  skipped.append(f"{label}: pola kode di {path} tidak cocok (pasang manual)"); return
              write(path, r)
              applied.append(f"{label} ({path})")

          # ---- input: safemode ----
          def f_input(t):
              ext = ("#ifdef CONFIG_KSU\n"
                     "extern bool ksu_input_hook __read_mostly;\n"
                     "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                     "#endif\n\n")
              t2 = before_header(t, r'^static void input_handle_event\(', ext)
              if t2 is None: return None
              if have('ksu_input_hook'):
                  call = ("#ifdef CONFIG_KSU\n"
                          "\tif (unlikely(ksu_input_hook))\n"
                          "\t\tksu_handle_input_handle_event(&type, &code, &value);\n"
                          "#endif\n")
              else:
                  t2 = t2.replace("extern bool ksu_input_hook __read_mostly;\n", "")
                  call = ("#ifdef CONFIG_KSU\n"
                          "\tksu_handle_input_handle_event(&type, &code, &value);\n"
                          "#endif\n")
              m = re.search(r'^static void input_handle_event\(.*?\{\s*\n\s*int disposition = input_get_disposition\(dev, type, code, &value\);\n', t2, re.M | re.S)
              if not m: return None
              return t2[:m.end()] + call + t2[m.end():]
          patch('drivers/input/input.c', 'input (safemode)', ['ksu_handle_input_handle_event'], 'ksu_handle_input_handle_event', f_input)

          # ---- devpts ----
          def f_devpts(t):
              hm = re.search(r'^void \*devpts_get_priv\(\s*struct (dentry|inode)\s*\*\s*(\w+)\s*\)\s*\{', t, re.M)
              if not hm: return None
              arg = f"{hm.group(2)}->d_inode" if hm.group(1) == 'dentry' else hm.group(2)
              ext = "#ifdef CONFIG_KSU\nextern int ksu_handle_devpts(struct inode*);\n#endif\n\n"
              ls = line_start(t, hm.start())
              t = t[:ls] + ext + t[ls:]
              hm = re.search(r'^void \*devpts_get_priv\(\s*struct (dentry|inode)\s*\*\s*(\w+)\s*\)\s*\{', t, re.M)
              call = f"#ifdef CONFIG_KSU\n\tksu_handle_devpts({arg});\n#endif\n"
              return t[:hm.end()] + "\n" + call + t[hm.end():]
          patch('fs/devpts/inode.c', 'devpts', ['ksu_handle_devpts'], 'ksu_handle_devpts', f_devpts)

          # ---- exec.c: execveat ----
          def f_execveat(t):
              ext = ("#ifdef CONFIG_KSU\n"
                     "extern bool ksu_execveat_hook __read_mostly;\n"
                     "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n"
                     "\t\t\tvoid *envp, int *flags);\n"
                     "#endif\n\n")
              hdr = r'^static int do_execveat_common\([^{;]*?\)\s*\{'
              t2 = before_header(t, hdr, ext)
              if t2 is None: return None
              if have('ksu_execveat_hook'):
                  call = ("#ifdef CONFIG_KSU\n"
                          "\tif (unlikely(ksu_execveat_hook))\n"
                          "\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                          "#endif\n\n")
              else:
                  t2 = t2.replace("extern bool ksu_execveat_hook __read_mostly;\n", "", 1)
                  call = ("#ifdef CONFIG_KSU\n"
                          "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                          "#endif\n\n")
              return before_target(t2, hdr, r'^\s*if \(IS_ERR\(filename\)\)', call)
          patch('fs/exec.c', 'execveat', ['ksu_handle_execveat'], 'ksu_handle_execveat', f_execveat)

          # ---- exec.c: sucompat (execve + compat) ----
          def f_sucompat(t):
              ext = ("#ifdef CONFIG_KSU\n"
                     "extern bool ksu_execveat_hook __read_mostly;\n"
                     "extern int ksu_handle_execve_sucompat(int *fd, const char __user **filename_user,\n"
                     "\t\t\t       void *__never_use_argv, void *__never_use_envp,\n"
                     "\t\t\t       int *__never_use_flags);\n"
                     "int at_fdcwd = AT_FDCWD;\n"
                     "#endif\n\n")
              if have('ksu_execveat_hook'):
                  call = ("#ifdef CONFIG_KSU\n"
                          "\tif (!ksu_execveat_hook)\n"
                          "\t\tksu_handle_execve_sucompat(&at_fdcwd, &filename, NULL, NULL, NULL);\n"
                          "#endif\n")
              else:
                  ext = ext.replace("extern bool ksu_execveat_hook __read_mostly;\n", "")
                  call = ("#ifdef CONFIG_KSU\n"
                          "\tksu_handle_execve_sucompat(&at_fdcwd, &filename, NULL, NULL, NULL);\n"
                          "#endif\n")
              h1 = r'^SYSCALL_DEFINE3\(execve,[^{;]*\{'
              t = before_header(t, h1, ext)
              if t is None: return None
              t = after_header_brace(t, h1, call)
              if t is None: return None
              h2 = r'^COMPAT_SYSCALL_DEFINE3\(execve,[^{;]*\{'
              if re.search(h2, t, re.M | re.S):
                  t = after_header_brace(t, h2, call)
              return t
          patch('fs/exec.c', 'execve sucompat', ['ksu_handle_execve_sucompat'], 'ksu_handle_execve_sucompat', f_sucompat)

          # ---- open.c: faccessat ----
          def f_faccessat(t):
              ext = ("#ifdef CONFIG_KSU\n"
                     "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,\n"
                     "\t\t\t                    int *flags);\n"
                     "#endif\n\n")
              hdr = r'^SYSCALL_DEFINE3\(faccessat,[^{;]*\{'
              t2 = before_header(t, hdr, ext)
              if t2 is None: return None
              call = "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\n"
              return before_target(t2, hdr, r'^\s*if \(mode & ~S_IRWXO\)', call)
          patch('fs/open.c', 'faccessat', ['ksu_handle_faccessat'], 'ksu_handle_faccessat', f_faccessat)

          # ---- read_write.c: sys_read ----
          def f_read(t):
              ext = ("#ifdef CONFIG_KSU\n"
                     "extern bool ksu_vfs_read_hook __read_mostly;\n"
                     "extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr,\n"
                     "\t\t\tsize_t *count_ptr);\n"
                     "#endif\n\n")
              hdr = r'^SYSCALL_DEFINE3\(read,[^{;]*\{'
              t2 = before_header(t, hdr, ext)
              if t2 is None: return None
              if have('ksu_vfs_read_hook'):
                  call = ("#ifdef CONFIG_KSU\n"
                          "\t\tif (unlikely(ksu_vfs_read_hook))\n"
                          "\t\t\tksu_handle_sys_read(fd, &buf, &count);\n"
                          "#endif\n")
              else:
                  t2 = t2.replace("extern bool ksu_vfs_read_hook __read_mostly;\n", "", 1)
                  call = ("#ifdef CONFIG_KSU\n"
                          "\t\tksu_handle_sys_read(fd, &buf, &count);\n"
                          "#endif\n")
              return before_target(t2, hdr, r'^\s*ret = vfs_read\(f\.file, buf, count, &pos\);', call)
          patch('fs/read_write.c', 'sys_read', ['ksu_handle_sys_read'], 'ksu_handle_sys_read', f_read)

          # ---- stat.c ----
          def make_stat(name):
              def f(t):
                  hdr = rf'^SYSCALL_DEFINE4\({name},[^{{;]*\{{'
                  ext = ("#ifdef CONFIG_KSU\n"
                         "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
                         "#endif\n\n")
                  t2 = before_header(t, hdr, ext)
                  if t2 is None: return None
                  call = "#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n"
                  return before_target(t2, hdr, r'^\s*error = vfs_fstatat\(dfd, filename, &stat, flag\);', call)
              return f

          def stat_all(t):
              # newfstatat wajib; fstatat64 (32-bit) opsional
              r = make_stat('newfstatat')(t)
              if r is None: return None
              r2 = make_stat('fstatat64')(r)
              return r2 if r2 is not None else r
          patch('fs/stat.c', 'stat', ['ksu_handle_stat'], 'ksu_handle_stat', stat_all)

          print("=== Hook terpasang ===")
          for a in applied: print("OK    ", a)
          print("=== Dilewati ===")
          for s in skipped: print("SKIP  ", s)
          PYEOF
          python3 /tmp/ksu_hooks.py
          echo "--- ringkasan perubahan"
          git diff --stat || true
          echo "--- handler KSU lain yang butuh hook (setuid / prctl / LSM)"
          grep -RIn -E "ksu_handle_setuid|ksu_handle_setresuid|ksu_handle_prctl|ksu_handle_rename|ksu_bprm_check|ksu_inode_permission" drivers/kernelsu/ 2>/dev/null | head -n 30 || true
          echo "--- Kconfig KSU (mode hook)"
          grep -n -A8 -E "config KSU_LSM_SECURITY_HOOKS|config KSU_WITH_KPROBES|config KSU_MANUAL" drivers/kernelsu/Kconfig 2>/dev/null | head -n 60 || true

      # xxksu cukup lewat defconfig (tanpa fragment). Mode syscall = manual hook, KPROBES mati.
      # Hook manual (execve, faccessat, stat, read, input, devpts) harus sudah ada di source.
      - name: 🛡️ Aktifkan xxksu via defconfig
        if: ${{ github.event.inputs.XXKSU == 'true' }}
        working-directory: kernel
        run: |
          CFG="arch/arm64/configs/$KERNEL_CONFIG"
          scripts/config --file "$CFG" --enable CONFIG_KSU
          scripts/config --file "$CFG" --disable CONFIG_KSU_WITH_KPROBES

          if [ "$KSU_HOOK_MODE" = "syscall" ]; then
            # Mode syscall: KSU menimpa syscall table sendiri, tanpa patch hook di source kernel
            if ! grep -RqsE "config KSU_TAMPER_SYSCALL_TABLE" drivers/kernelsu/ ; then
              echo "::error::Versi KSU ini tidak punya KSU_TAMPER_SYSCALL_TABLE (hasil setup.sh bukan versi yang support mode syscall)"
              ls -la drivers/kernelsu/ KernelSU 2>/dev/null | head -n 20
              exit 1
            fi
            scripts/config --file "$CFG" --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE
            echo "--- Kconfig KSU_TAMPER_SYSCALL_TABLE"
            grep -RhnE -B1 -A14 "config KSU_TAMPER_SYSCALL_TABLE" drivers/kernelsu/ | head -n 40 || true
          fi
          grep -n "CONFIG_KSU" "$CFG"
          [ -d drivers/kernelsu ] && echo "ok    driver KSU: drivers/kernelsu" || echo "::warning::folder driver KSU tidak ketemu, pastikan sudah ada di source"

          if [ "$KSU_HOOK_MODE" = "manual" ]; then
            echo "--- cek hook manual di source"
            miss=0
            chk() {  # file pola
              if [ -f "$1" ] && grep -q "$2" "$1"; then echo "ok    $1 ($2)"
              else echo "::warning::hook TIDAK ada: $1 ($2)"; miss=1; fi
            }
            chk fs/exec.c     "ksu_handle_execveat"
            chk fs/exec.c     "ksu_handle_execve_sucompat\\|ksu_handle_execveat_sucompat"
            chk fs/open.c     "ksu_handle_faccessat"
            chk fs/stat.c     "ksu_handle_stat"
            chk fs/read_write.c "ksu_handle_sys_read\\|ksu_handle_vfs_read"
            chk drivers/input/input.c "ksu_handle_input_handle_event"
            grep -rqs "ksu_handle_devpts" fs/devpts drivers/tty && echo "ok    devpts" || { echo "::warning::hook devpts tidak ada"; miss=1; }
            [ "$miss" = 1 ] && echo "::warning::Ada hook yang belum terpasang (hook yang tidak didefinisikan driver KSU memang dilewati)"
          fi

      # Racikan anti kedip LCD (panel KW/gantian di SDM660):
      # ESD/status check off, LPM off, KCAL on, idle power collapse off.
      - name: 🖥️ Patch anti kedip LCD
        if: ${{ github.event.inputs.ANTI_FLICKER == 'true' }}
        working-directory: kernel
        run: |
          CFG="arch/arm64/configs/$KERNEL_CONFIG"

          echo "--- defconfig sebelum"
          grep -n -E "MDSS_DSI_CTRL_STATUS|MDSS_LPM|MDSS_KCAL" "$CFG" || echo "(tidak ada)"
          scripts/config --file "$CFG" --disable CONFIG_FB_MSM_MDSS_DSI_CTRL_STATUS
          scripts/config --file "$CFG" --disable CONFIG_FB_MSM_MDSS_LPM_ENABLE
          scripts/config --file "$CFG" --enable  CONFIG_FB_MSM_MDSS_KCAL_CTRL
          echo "--- defconfig sesudah"
          grep -n -E "MDSS_DSI_CTRL_STATUS|MDSS_LPM|MDSS_KCAL" "$CFG"

          echo "--- DTSI panel: matikan lpm / idle-pc / ulps"
          PANELS=$(find arch/arm64/boot/dts -name 'dsi-panel-*.dtsi' -o -name '*lavender*.dts*' | sort)
          for f in $PANELS; do
            if grep -q -E "qcom,mdss-dsi-(pan-enable-lpm|idle-pc-enabled|ulps-enabled)" "$f"; then
              echo ">> $f"
              grep -n -E "qcom,mdss-dsi-(pan-enable-lpm|idle-pc-enabled|ulps-enabled)" "$f"
              # bentuk integer: <1> -> <0>
              sed -i -E 's/^([[:space:]]*qcom,mdss-dsi-(pan-enable-lpm|idle-pc-enabled|ulps-enabled)[[:space:]]*=[[:space:]]*)<[1-9][0-9]*>;/\1<0>;/' "$f"
              # bentuk boolean (tanpa nilai): di-komen supaya off
              sed -i -E 's|^([[:space:]]*)(qcom,mdss-dsi-(pan-enable-lpm\|idle-pc-enabled\|ulps-enabled));|\1/* \2; (anti-kedip) */|' "$f"
              echo "   sesudah:"
              grep -n -E "qcom,mdss-dsi-(pan-enable-lpm|idle-pc-enabled|ulps-enabled)" "$f" || echo "   (sudah tidak ada)"
            fi
          done

          echo "--- mdss_mdp.c: idle_pc_enabled = false"
          MDP="drivers/video/fbdev/msm/mdss_mdp.c"
          if [ -f "$MDP" ]; then
            grep -n "idle_pc_enabled" "$MDP" || true
            sed -i -E 's/(idle_pc_enabled[[:space:]]*=)[[:space:]]*[^=;][^;]*;/\1 false;/' "$MDP"
            echo "   sesudah:"
            grep -n "idle_pc_enabled" "$MDP" || true
          else
            echo "::warning::$MDP tidak ditemukan, lewati"
          fi

      - name: 🩹 Fix build 4.4 (dtc yylloc, gcc modern)
        working-directory: kernel
        run: |
          # GCC 10+ default -fno-common -> "multiple definition of yylloc" di scripts/dtc
          for f in scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.l scripts/dtc/dtc-parser.tab.c_shipped; do
            [ -f "$f" ] || continue
            grep -n "yylloc" "$f" | head -n 5 || true
            sed -i -E 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"
          done
          echo "--- sesudah"
          grep -n "YYLTYPE yylloc" scripts/dtc/*.c_shipped scripts/dtc/*.l 2>/dev/null || true
          # hapus file hasil generate lama kalau ada
          rm -f scripts/dtc/dtc-lexer.lex.c scripts/dtc/dtc-parser.tab.c scripts/dtc/dtc-parser.tab.h 2>/dev/null || true

      - name: 🔨 Build Kernel
        working-directory: kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64

          # ThinLTO + lld baru menolak opsi import-instr-limit yang dobel; pakai pembungkus yang membuang duplikatnya
          # Tanpa LTO pakai GNU ld dari GCC 4.9: lld baru gagal untuk built-in.o kosong
          # ("ld.lld: error: target emulation unknown: -m or at least one .o file required")
          # lld hanya dipakai kalau LTO diminta DAN source mendukung LTO_CLANG.
          # Source tanpa LTO + lld gagal link vmlinux ("can't create dynamic relocation R_AARCH64_ABS64 ... -z notext").
          LTO_SUPPORTED=0
          grep -q "LTO_CLANG" init/Kconfig arch/arm64/Kconfig 2>/dev/null && LTO_SUPPORTED=1
          USE_LLD=0
          if { [ "$LTO_MODE" = "full" ] || [ "$LTO_MODE" = "thin" ]; } && [ "$LTO_SUPPORTED" = 1 ]; then
            USE_LLD=1
          fi
          if [ "$USE_LLD" = 0 ] && command -v aarch64-linux-android-ld >/dev/null; then
            LD_BIN=aarch64-linux-android-ld
          else
            LD_BIN=ld.lld
          fi
          echo "LTO_MODE=$LTO_MODE, source support LTO_CLANG=$LTO_SUPPORTED, LD yang dipakai: $LD_BIN"
          if [ "$LD_BIN" = "ld.lld" ]; then
            cat > /tmp/ld-dedup.sh << 'LD_EOF'
          #!/bin/bash
          seen=0
          args=()
          while [ $# -gt 0 ]; do
            if [ "$1" = "-mllvm" ] && [ $# -ge 2 ] && [[ "$2" == *import-instr-limit=* ]]; then
              if [ $seen -eq 0 ]; then args+=("$1" "$2"); seen=1; fi
              shift 2
              continue
            fi
            if [[ "$1" == *import-instr-limit=* ]]; then
              if [ $seen -eq 0 ]; then args+=("$1"); seen=1; fi
              shift
              continue
            fi
            args+=("$1")
            shift
          done
          # lld menolak "ld -r" tanpa input kalau tidak ada emulation (-m)
          hasm=0
          for a in "${args[@]}"; do
            case "$a" in -m|-maarch64*|-marm*|-melf*) hasm=1 ;; esac
          done
          [ $hasm -eq 0 ] && args=(-m aarch64linux "${args[@]}")
          # kernel PIE/KASLR: izinkan text relocation supaya lld tidak menolak link vmlinux
          args+=(-z notext)
          exec ld.lld "${args[@]}"
          LD_EOF
            chmod +x /tmp/ld-dedup.sh
            LD_BIN=/tmp/ld-dedup.sh
          fi

          # Clang baru + -Werror di qcacld-3.0: cast void* ke enum jadi error
          # -fno-builtin-stpcpy: clang baru mengubah sprintf jadi stpcpy, kernel 4.4 tidak punya ("undefined reference to stpcpy")
          export KCFLAGS="-Wno-void-pointer-to-enum-cast -fno-builtin-stpcpy"

          ARGS="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=${LD_BIN} AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"

          make $ARGS "$KERNEL_CONFIG" $CONFIG_FRAGMENTS 2>&1 | tee build.log

          # Kernel release max 64 karakter: pakai LOCALVERSION pendek (ASCII), matikan -g<hash>-dirty
          LV=$(printf '%s' "${EXTRAVERSION:-$CODENAME}" | tr -cd 'A-Za-z0-9._-')
          [ -z "$LV" ] && LV="$CODENAME"
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-${LV}"
          scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO
          echo "LOCALVERSION: -${LV}"

          echo "Mode LTO: $LTO_MODE"
          if grep -q "LTO_CLANG" init/Kconfig arch/arm64/Kconfig 2>/dev/null; then
            case "$LTO_MODE" in
              full)
                scripts/config --file out/.config --enable CONFIG_LTO_CLANG
                scripts/config --file out/.config --disable CONFIG_THINLTO
                ;;
              thin)
                scripts/config --file out/.config --enable CONFIG_LTO_CLANG
                scripts/config --file out/.config --enable CONFIG_THINLTO
                ;;
              none)
                scripts/config --file out/.config --disable CONFIG_LTO_CLANG
                ;;
            esac
          else
            echo "Source ini tidak punya LTO_CLANG, mode LTO diabaikan"
          fi

          # Pastikan racikan anti kedip tidak ditimpa olddefconfig / dependensi
          if [ "$ANTI_FLICKER" = "true" ]; then
            scripts/config --file out/.config --disable CONFIG_FB_MSM_MDSS_DSI_CTRL_STATUS
            scripts/config --file out/.config --disable CONFIG_FB_MSM_MDSS_LPM_ENABLE
            scripts/config --file out/.config --enable  CONFIG_FB_MSM_MDSS_KCAL_CTRL
          fi
          if [ "$XXKSU" = "true" ]; then
            scripts/config --file out/.config --enable CONFIG_KSU
            scripts/config --file out/.config --disable CONFIG_KSU_WITH_KPROBES
            if [ "$KSU_HOOK_MODE" = "syscall" ]; then
              scripts/config --file out/.config --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE
            fi
          fi
          make $ARGS olddefconfig 2>&1 | tee -a build.log

          if [ "$XXKSU" = "true" ]; then
            echo "--- CONFIG_KSU* di out/.config"
            grep -n "CONFIG_KSU" out/.config || true
            KSU_SYMS="KSU"
            if [ "$KSU_HOOK_MODE" = "syscall" ]; then KSU_SYMS="KSU KSU_TAMPER_SYSCALL_TABLE"; fi
            for sym in $KSU_SYMS; do
              grep -q "^CONFIG_${sym}=y" out/.config || {
                echo "::error::CONFIG_${sym} tidak aktif (dependensi Kconfig belum terpenuhi / simbol tidak ada)" | tee -a build.log
                grep -n "CONFIG_KSU" out/.config | tee -a build.log || true
                grep -RhnE -B1 -A14 "config ${sym}\$" drivers/kernelsu/ | head -n 40 | tee -a build.log || true
                exit 1
              }
            done
            grep -q "^CONFIG_KSU_WITH_KPROBES=y" out/.config && echo "::warning::KPROBES masih aktif"
          fi

          echo "--- Cek LTO di out/.config"
          grep -n "CONFIG_LTO\|CONFIG_THINLTO" out/.config || true
          if [ "$LTO_MODE" = "full" ] || [ "$LTO_MODE" = "thin" ]; then
            if grep -q "^CONFIG_LTO_CLANG=y" out/.config; then
              echo "LTO_CLANG aktif (mode $LTO_MODE)"
            else
              echo "::warning::LTO_CLANG TIDAK aktif: source tidak mendukung LTO, build jalan tanpa LTO"
            fi
          fi

          echo "--- Cek LCD config di out/.config"
          grep -n -E "MDSS_DSI_CTRL_STATUS|MDSS_LPM|MDSS_KCAL" out/.config || true
          if [ "$ANTI_FLICKER" = "true" ]; then
            grep -q "^CONFIG_FB_MSM_MDSS_DSI_CTRL_STATUS=y" out/.config && echo "::warning::DSI_CTRL_STATUS masih aktif (ke-select dependensi lain)"
            grep -q "^CONFIG_FB_MSM_MDSS_LPM_ENABLE=y" out/.config && echo "::warning::LPM_ENABLE masih aktif (ke-select dependensi lain)"
            grep -q "^CONFIG_FB_MSM_MDSS_KCAL_CTRL=y" out/.config || echo "::warning::KCAL_CTRL tidak aktif (source tidak punya driver KCAL?)"
          fi

          set +e
          make -k -j$(nproc --all) $ARGS Image.gz-dtb 2>&1 | tee -a build.log
          set -e

          BOOT=out/arch/arm64/boot
          # Fallback kalau target Image.gz-dtb tidak ada: gabung manual Image.gz + dtb hasil build
          if [ ! -f "$BOOT/Image.gz-dtb" ]; then
            set +e
            make -k -j$(nproc --all) $ARGS Image.gz dtbs 2>&1 | tee -a build.log
            set -e
            if [ -f "$BOOT/Image.gz" ]; then
              DTBS=$(find "$BOOT/dts" -name '*.dtb' | sort)
              echo "Jumlah dtb yang berhasil: $(echo "$DTBS" | grep -c .)"
              cat "$BOOT/Image.gz" $DTBS > "$BOOT/Image.gz-dtb"
            fi
          fi

          IMG=$(find out/arch/arm64/boot -type f -name "Image.gz-dtb" | head -n1)
          [ -z "$IMG" ] && IMG=$(find out/arch/arm64/boot -type f \( -name "Image.gz" -o -name "Image" \) | head -n1)

          if [ -z "$IMG" ]; then
            echo "Build gagal, image tidak ditemukan!" | tee -a build.log
            exit 1
          fi

          echo "IMG_PATH=$(pwd)/$IMG" >> $GITHUB_ENV

      - name: 🏷️ Setup file names
        run: |
          DATE=$(date +%Y%m%d)
          if [ -n "$EXTRAVERSION" ]; then
            BASE_NAME="${EXTRAVERSION}-${CODENAME}-${DATE}"
          else
            BASE_NAME="${CODENAME}-${DATE}"
          fi
          echo "BASE_NAME=${BASE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=build-${{ github.run_id }}" >> $GITHUB_ENV

      - name: 🎁 Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/*.zip
          cp "$IMG_PATH" AnyKernel3/
          sed -i "s/device.name1=.*/device.name1=${CODENAME}/" AnyKernel3/anykernel.sh || true
          AKS=AnyKernel3/anykernel.sh
          # Default AnyKernel3 memakai partisi boot contoh (omap_hsmmc) -> "Unable to determine ... boot partition"
          sed -i -E 's#^(BLOCK|block)=.*#\1=/dev/block/bootdevice/by-name/boot;#' "$AKS"
          sed -i -E 's#^(IS_SLOT_DEVICE|is_slot_device)=.*#\1=0;#' "$AKS"
          sed -i "s|^kernel.string=.*|kernel.string=${BASE_NAME}|" "$AKS"
          for n in 2 3 4 5; do sed -i "s|^device.name${n}=.*|device.name${n}=|" "$AKS"; done
          echo "--- anykernel.sh (properti & partisi)"
          grep -n -E "^(kernel.string|do\.|device\.name|BLOCK|block|IS_SLOT_DEVICE|is_slot_device|RAMDISK_COMPRESSION|ramdisk_compression)" "$AKS" || true
          cd AnyKernel3
          zip -r9 "../${BASE_NAME}.zip" . -x ".git*" -x "*.zip"
          cd ..
          echo "ZIP_PATH=$(pwd)/${BASE_NAME}.zip" >> $GITHUB_ENV

      - name: 🚀 Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.BASE_NAME }}"
          files: ${{ env.ZIP_PATH }}

      - name: "📤 Telegram: Kirim Hasil Build (.zip)"
        continue-on-error: true
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::BOT_TOKEN/CHAT_ID kosong (secret belum dibuat atau namanya salah), lewati Telegram"
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${ZIP_PATH}" \
            -F caption="✅ Build Berhasil: ${BASE_NAME}"
          echo

      - name: 🔎 Diagnosa memori (OOM?)
        if: failure()
        continue-on-error: true
        run: |
          free -h || true
          swapon --show || true
          df -h / /mnt || true
          sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill|killed process" | tail -n 5 || true

      - name: "📤 Telegram: Kirim Log saat Gagal"
        if: failure()
        continue-on-error: true
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::BOT_TOKEN/CHAT_ID kosong (secret belum dibuat atau namanya salah), log tidak dikirim"
            exit 0
          fi
          LOG="kernel/build.log"
          if [ ! -f "$LOG" ]; then
            echo "build.log tidak ada (gagal sebelum tahap build), kirim pesan teks saja"
            curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="❌ Build Gagal pada ${CODENAME} sebelum tahap build. Cek tab Actions."
            echo
            exit 0
          fi

          grep -nE "error:|\*\*\* |Error [0-9]+$" "$LOG" | head -n 80 > errors.txt || true
          [ -s errors.txt ] || tail -n 100 "$LOG" > errors.txt
          gzip -9 -c "$LOG" > build-log.gz

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"errors.txt" \
            -F caption="❌ Build Gagal pada ${CODENAME}. Ringkasan error."
          echo
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"build-log.gz" \
            -F caption="Log lengkap (gzip)"
          echo
