name: Manual Build Kernel - NM PROJECT

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "URL repo kernel source"
        required: true
        type: string
        default: "https://github.com/FlopKernel-Series/flop_trinket-mi_kernel"
      KERNEL_BRANCH:
        description: "Branch kernel source"
        required: true
        type: string
        default: "floppy-unity"
      KERNEL_CONFIG:
        description: "Nama defconfig"
        required: true
        type: string
        default: "ginkgo-stock_defconfig"
      CODENAME:
        description: "Codename device"
        required: true
        type: string
        default: "ginkgo"
      EXTRAVERSION:
        description: "EXTRAVERSION / Nama Kernel"
        required: false
        type: string
        default: "NMメPROJECT"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_SOURCE: ${{ github.event.inputs.KERNEL_SOURCE }}
      KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_BRANCH }}
      KERNEL_CONFIG: ${{ github.event.inputs.KERNEL_CONFIG }}
      CODENAME: ${{ github.event.inputs.CODENAME }}
      EXTRAVERSION: ${{ github.event.inputs.EXTRAVERSION }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      KBUILD_BUILD_USER: "github-actions"
      KBUILD_BUILD_HOST: "ci"

    steps:
      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: 📦 Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget zip unzip python3 python-is-python3 \
            cpio kmod rsync ccache dwarves libncurses-dev \
            device-tree-compiler

      - name: 🗃️ Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 📥 Clone kernel source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          cd kernel
          if git submodule status | grep -qE '^-'; then
            git submodule update --init --recursive
          fi
          cd ..
          echo "KDIR=$(pwd)/kernel" >> $GITHUB_ENV

      - name: 🛠️ Setup Clang (Proton-Clang) & GCC
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32

          echo "$(pwd)/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc64/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc32/bin" >> $GITHUB_PATH

      - name: 🔓 Cek xxksu bawaan source + hook syscall
        working-directory: kernel
        run: |
          # Source Flop sudah membawa xxksu -> TIDAK pakai setup.sh
          echo "--- .gitmodules"; cat .gitmodules 2>/dev/null || true
          echo "--- submodule"; git submodule status || true
          for d in xxksu kernelsu; do
            echo "--- isi drivers/$d"; ls -la "drivers/$d" 2>&1 | head -20
          done
          echo "--- referensi di drivers/Kconfig & Makefile"
          grep -n -i -E "xxksu|kernelsu" drivers/Kconfig drivers/Makefile || true
          echo "--- definisi simbol KSU di Kconfig"
          grep -rn --include='Kconfig*' -A10 "^config KSU" drivers | head -60 || true
          echo "--- KSU di defconfig"
          grep -n -i ksu "arch/arm64/configs/$KERNEL_CONFIG" || true

          # Komentari 'source' Kconfig KSU yang filenya tidak ada
          for f in $(grep -oE 'source "drivers/[^"]*(xxksu|kernelsu)[^"]*Kconfig"' drivers/Kconfig | sed 's/source "\(.*\)"/\1/'); do
            if [ ! -f "$f" ]; then
              echo "::warning::$f tidak ada, baris source dikomentari"
              sed -i "\|source \"$f\"|s|^|# |" drivers/Kconfig
            fi
          done

          if ! grep -rqs --include='Kconfig*' "^config KSU_XXKSU" drivers; then
            echo "::error::Simbol KSU_XXKSU tidak didefinisikan di Kconfig mana pun"
            exit 1
          fi

          # Hook syscall manual (scope-minimized, backslashxx/KernelSU#5)
          if grep -q "ksu_handle_execve_sucompat\|ksu_handle_execveat" fs/exec.c; then
            echo "Hook sudah ada di source, skip patch"
          else
            cat > /tmp/ksu-hooks.patch << 'PATCH_EOF'
          diff --git a/drivers/input/input.c b/drivers/input/input.c
          --- a/drivers/input/input.c
          +++ b/drivers/input/input.c
          @@ -377,10 +377,19 @@ static int input_get_disposition(struct input_dev *dev,
           	return disposition;
           }

          +#ifdef CONFIG_KSU
          +extern bool ksu_input_hook __read_mostly;
          +extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          +#endif
          +
           static void input_handle_event(struct input_dev *dev,
           			       unsigned int type, unsigned int code, int value)
           {
           	int disposition = input_get_disposition(dev, type, code, &value);
          +#ifdef CONFIG_KSU
          +	if (unlikely(ksu_input_hook))
          +		ksu_handle_input_handle_event(&type, &code, &value);
          +#endif

           	if (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)
           		add_input_randomness(type, code, value);
          diff --git a/fs/devpts/inode.c b/fs/devpts/inode.c
          --- a/fs/devpts/inode.c
          +++ b/fs/devpts/inode.c
          @@ -602,6 +602,10 @@ struct dentry *devpts_pty_new(struct pts_fs_info *fsi, int index, void *priv)
           	return dentry;
           }

          +#ifdef CONFIG_KSU
          +extern int ksu_handle_devpts(struct inode*);
          +#endif
          +
           /**
            * devpts_get_priv -- get private data for a slave
            * @pts_inode: inode of the slave
          @@ -610,6 +614,9 @@ struct dentry *devpts_pty_new(struct pts_fs_info *fsi, int index, void *priv)
            */
           void *devpts_get_priv(struct dentry *dentry)
           {
          +#ifdef CONFIG_KSU
          +	ksu_handle_devpts(dentry->d_inode);
          +#endif
           	if (dentry->d_sb->s_magic != DEVPTS_SUPER_MAGIC)
           		return NULL;
           	return dentry->d_fsdata;
          diff --git a/fs/exec.c b/fs/exec.c
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1712,6 +1712,12 @@ static int exec_binprm(struct linux_binprm *bprm)
           	return ret;
           }

          +#ifdef CONFIG_KSU
          +extern bool ksu_execveat_hook __read_mostly;
          +extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          +			void *envp, int *flags);
          +#endif
          +
           /*
            * sys_execve() executes a new program.
            */
          @@ -1726,6 +1732,11 @@ static int do_execveat_common(int fd, struct filename *filename,
           	struct files_struct *displaced;
           	int retval;

          +#ifdef CONFIG_KSU
          +	if (unlikely(ksu_execveat_hook))
          +		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          +#endif
          +
           	if (IS_ERR(filename))
           		return PTR_ERR(filename);

          @@ -1968,11 +1979,22 @@ void set_dumpable(struct mm_struct *mm, int value)
           	} while (cmpxchg(&mm->flags, old, new) != old);
           }

          +#ifdef CONFIG_KSU
          +extern int ksu_handle_execve_sucompat(int *fd, const char __user **filename_user,
          +			       void *__never_use_argv, void *__never_use_envp,
          +			       int *__never_use_flags);
          +int at_fdcwd = AT_FDCWD;
          +#endif
          +
           SYSCALL_DEFINE3(execve,
           		const char __user *, filename,
           		const char __user *const __user *, argv,
           		const char __user *const __user *, envp)
           {
          +#ifdef CONFIG_KSU
          +	if (!ksu_execveat_hook)
          +		ksu_handle_execve_sucompat(&at_fdcwd, &filename, NULL, NULL, NULL);
          +#endif
           	return do_execve(getname(filename), argv, envp);
           }

          @@ -1994,6 +2016,10 @@ COMPAT_SYSCALL_DEFINE3(execve, const char __user *, filename,
           	const compat_uptr_t __user *, argv,
           	const compat_uptr_t __user *, envp)
           {
          +#ifdef CONFIG_KSU
          +	if (!ksu_execveat_hook)
          +		ksu_handle_execve_sucompat(&at_fdcwd, &filename, NULL, NULL, NULL); /* 32-bit su support */
          +#endif
           	return compat_do_execve(getname(filename), argv, envp);
           }
          diff --git a/fs/open.c b/fs/open.c
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -354,6 +354,11 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
           	return error;
           }

          +#ifdef CONFIG_KSU
          +extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,
          +					    int *flags);
          +#endif
          +
           /*
            * access() needs to use the real uid/gid, not the effective uid/gid.
            * We do this by temporarily clearing all FS-related capabilities and
          @@ -369,6 +374,10 @@ SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
           	int res;
           	unsigned int lookup_flags = LOOKUP_FOLLOW;

          +#ifdef CONFIG_KSU
          +	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          +#endif
          +
           	if (mode & ~S_IRWXO)	/* where's F_OK, X_OK, W_OK, R_OK? */
           		return -EINVAL;

          diff --git a/fs/read_write.c b/fs/read_write.c
          --- a/fs/read_write.c
          +++ b/fs/read_write.c
          @@ -568,6 +568,12 @@ static inline void file_pos_write(struct file *file, loff_t pos)
           		file->f_pos = pos;
           }

          +#ifdef CONFIG_KSU
          +extern bool ksu_vfs_read_hook __read_mostly;
          +extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr,
          +			size_t *count_ptr);
          +#endif
          +
           SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
           {
           	struct fd f = fdget_pos(fd);
          @@ -575,6 +581,10 @@ SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)

           	if (f.file) {
           		loff_t pos = file_pos_read(f.file);
          +#ifdef CONFIG_KSU
          +		if (unlikely(ksu_vfs_read_hook))
          +			ksu_handle_sys_read(fd, &buf, &count);
          +#endif
           		ret = vfs_read(f.file, buf, count, &pos);
           		if (ret >= 0)
           			file_pos_write(f.file, pos);
          diff --git a/fs/stat.c b/fs/stat.c
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -353,6 +353,10 @@ SYSCALL_DEFINE2(newlstat, const char __user *, filename,
           	return cp_new_stat(&stat, statbuf);
           }

          +#ifdef CONFIG_KSU
          +extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          +#endif
          +
           #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
           SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
           		struct stat __user *, statbuf, int, flag)
          @@ -360,6 +364,9 @@ SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
           	struct kstat stat;
           	int error;

          +#ifdef CONFIG_KSU
          +	ksu_handle_stat(&dfd, &filename, &flag);
          +#endif
           	error = vfs_fstatat(dfd, filename, &stat, flag);
           	if (error)
           		return error;
          @@ -504,6 +511,9 @@ SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,
           	struct kstat stat;
           	int error;

          +#ifdef CONFIG_KSU
          +	ksu_handle_stat(&dfd, &filename, &flag); /* 32-bit su support */
          +#endif
           	error = vfs_fstatat(dfd, filename, &stat, flag);
           	if (error)
           		return error;
          PATCH_EOF
            git apply --recount --ignore-whitespace --check /tmp/ksu-hooks.patch || {
              echo "::error::Patch hook tidak cocok dengan source ini"
              exit 1
            }
            git apply --recount --ignore-whitespace /tmp/ksu-hooks.patch
            echo "Hook syscall berhasil dipasang"
          fi

          # Pilih xxksu lewat defconfig
          scripts/config --file "arch/arm64/configs/$KERNEL_CONFIG" --enable CONFIG_KSU_XXKSU
          scripts/config --file "arch/arm64/configs/$KERNEL_CONFIG" --disable CONFIG_KSU_NEXT

      - name: 🔨 Build Kernel (Full LTO)
        working-directory: kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          [ -n "$EXTRAVERSION" ] && export LOCALVERSION="-${EXTRAVERSION}"

          ARGS="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"

          make $ARGS "$KERNEL_CONFIG" 2>&1 | tee build.log

          # Full LTO = LTO_CLANG aktif, THINLTO mati
          scripts/config --file out/.config --enable CONFIG_LTO_CLANG
          scripts/config --file out/.config --disable CONFIG_THINLTO
          make $ARGS olddefconfig 2>&1 | tee -a build.log

          echo "--- CONFIG_KSU* di out/.config"
          grep -n "CONFIG_KSU" out/.config || true
          grep -q "^CONFIG_KSU_XXKSU=y" out/.config || {
            echo "::error::CONFIG_KSU_XXKSU tidak aktif (dependensi Kconfig belum terpenuhi?)"
            exit 1
          }

          make -j$(nproc --all) $ARGS 2>&1 | tee -a build.log

          IMG=$(find out/arch/arm64/boot -type f -name "Image.gz-dtb" | head -n1)
          [ -z "$IMG" ] && IMG=$(find out/arch/arm64/boot -type f \( -name "Image.gz" -o -name "Image" \) | head -n1)

          if [ -z "$IMG" ]; then
            echo "Build gagal, image tidak ditemukan!"
            exit 1
          fi

          echo "IMG_PATH=$(pwd)/$IMG" >> $GITHUB_ENV

      - name: 🏷️ Setup file names
        run: |
          DATE=$(date +%Y%m%d)
          if [ -n "$EXTRAVERSION" ]; then
            BASE_NAME="${EXTRAVERSION}-${CODENAME}-${DATE}"
          else
            BASE_NAME="${CODENAME}-${DATE}"
          fi
          echo "BASE_NAME=${BASE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=build-${{ github.run_id }}" >> $GITHUB_ENV

      - name: 🎁 Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/*.zip
          cp "$IMG_PATH" AnyKernel3/
          sed -i "s/device.name1=.*/device.name1=${CODENAME}/" AnyKernel3/anykernel.sh || true
          cd AnyKernel3
          zip -r9 "../${BASE_NAME}.zip" . -x ".git*" -x "*.zip"
          cd ..
          echo "ZIP_PATH=$(pwd)/${BASE_NAME}.zip" >> $GITHUB_ENV

      - name: 🚀 Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.BASE_NAME }}"
          files: ${{ env.ZIP_PATH }}

      - name: "📤 Telegram: Kirim Hasil Build (.zip)"
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${ZIP_PATH}" \
            -F caption="✅ Build Berhasil: ${BASE_NAME}"

      - name: "📤 Telegram: Kirim Log saat Gagal"
        if: failure() && env.BOT_TOKEN != '' && env.CHAT_ID != ''
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"kernel/build.log" \
            -F caption="❌ Build Gagal pada ${CODENAME}. Berikut log error-nya."
