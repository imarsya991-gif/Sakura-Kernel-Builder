name: Build Kernel - NM PROJECT (Ginkgo)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_SOURCE: "https://github.com/FlopKernel-Series/flop_trinket-mi_kernel"
      KERNEL_BRANCH: "floppy-unity"
      KERNEL_CONFIG: "ginkgo_defconfig"
      CODENAME: "ginkgo"
      EXTRAVERSION: "NMメPROJECT"
      KBUILD_BUILD_USER: "github-actions"
      KBUILD_BUILD_HOST: "ci"

    steps:
      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: 📦 Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget zip unzip python3 python-is-python3 \
            cpio kmod rsync ccache dwarves libncurses-dev \
            device-tree-compiler libssl1.0.0 || sudo apt-get install -y libssl-dev

      - name: 📥 Clone kernel source
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          echo "KDIR=$(pwd)/kernel" >> $GITHUB_ENV

      - name: 🛠️ Setup Clang (AOSP Clang Latest) & GCC 32/64
        run: |
          mkdir -p toolchain/clang toolchain/gcc64 toolchain/gcc32
          
          # Download Clang terbaru (AOSP Clang r488907 / r510928)
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r510928.tar.gz
          tar -xf clang-r510928.tar.gz -C toolchain/clang
          
          # Download GCC 64 & 32 sebagai pendukung Cross-Compile
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32

          echo "$(pwd)/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc64/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc32/bin" >> $GITHUB_PATH

      - name: 🔓 Patch KernelSU-Next
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 🔨 Build Kernel (Full LTO & Clang)
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LOCALVERSION="-${EXTRAVERSION}"

          # Konfigurasi LTO & Clang Flag
          ARGS="O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip"

          make $ARGS "$KERNEL_CONFIG"
          
          # Aktifkan Full LTO di .config
          scripts/config --file out/.config --enable CONFIG_LTO_CLANG
          scripts/config --file out/.config --disable CONFIG_THINLTO
          
          make -j$(nproc --all) $ARGS 2>&1 | tee build.log

          IMG=$(find out/arch/arm64/boot -type f -name "Image.gz-dtb" | head -n1)
          [ -z "$IMG" ] && IMG=$(find out/arch/arm64/boot -type f -name "Image.gz" | head -n1)
          
          echo "IMG_PATH=$(pwd)/$IMG" >> $GITHUB_ENV

      - name: 🎁 Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git
          cp "$IMG_PATH" AnyKernel3/
          sed -i "s/device.name1=.*/device.name1=${CODENAME}/" AnyKernel3/anykernel.sh
          cd AnyKernel3
          ZIP_NAME="${EXTRAVERSION}-${CODENAME}-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP_NAME" . -x "*.git*"
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV

      - name: 🚀 Publish Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NM-PROJECT-Kernel
          path: ${{ env.ZIP_PATH }}
